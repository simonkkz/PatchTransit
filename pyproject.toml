[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "patchtransit"
version = "0.1.2"
description = "Compare what two patches actually produce, with isolated verification and local evidence."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{name = "simonkkz"}]
keywords = ["git", "patch", "code-review", "testing", "ai-agents", "diff", "verification"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Operating System :: OS Independent",
    "Topic :: Software Development :: Version Control :: Git",
]

[project.urls]
Homepage = "https://simonkkz.github.io/PatchTransit/"
Source = "https://github.com/simonkkz/PatchTransit"
Issues = "https://github.com/simonkkz/PatchTransit/issues"
Releases = "https://github.com/simonkkz/PatchTransit/releases"
Changelog = "https://github.com/simonkkz/PatchTransit/blob/main/CHANGELOG.md"

[project.optional-dependencies]
dev = [
    "ruff==0.17.6",
    "pyrefly==1.5.0",
    "build==1.6.1",
    "jsonschema==4.26.0",
]

[project.scripts]
patchtransit = "patchtransit.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
patchtransit = ["py.typed"]

[tool.pyrefly]
project-includes = ["src"]
preset = "strict"
