[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "patchtransit"
version = "0.1.0"
description = "Compare what two patches actually produce, with isolated verification and local evidence."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{name = "simonkkz"}]
keywords = ["git", "patch", "code-review", "testing", "ai-agents", "diff", "verification"]
classifiers = ["Programming Language :: Python :: 3", "Operating System :: OS Independent", "Topic :: Software Development :: Version Control :: Git"]

[project.scripts]
patchtransit = "patchtransit.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
