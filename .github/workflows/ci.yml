name: Tests
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ['3.11', '3.12', '3.13', '3.14', '3.15']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Lint
        run: python -m ruff check src tests
      - name: Formatting
        run: python -m ruff format --check src tests
      - name: Static type checking
        run: python -m pyrefly check
      - name: Unit and integration tests
        run: python -m unittest discover -s tests -v
      - name: Build and install distributions
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.15'
        shell: bash
        run: |
          python -m build
          python -m venv "$RUNNER_TEMP/patchtransit-wheel-smoke"
          "$RUNNER_TEMP/patchtransit-wheel-smoke/bin/python" -m pip install --no-index --no-deps dist/*.whl
          "$RUNNER_TEMP/patchtransit-wheel-smoke/bin/patchtransit" --version
